<body class="bg-page text-text font-body min-h-screen overflow-x-hidden overflow-y-auto flex flex-col transition-colors duration-1000 relative">
    <div
        id="entry-gate"
        class="entry-gate fixed inset-0 z-[80] flex items-center justify-center px-5 py-8"
        hidden
        aria-hidden="true"
        aria-modal="true"
        role="dialog"
        aria-labelledby="entry-gate-title"
        aria-describedby="entry-gate-copy"
    >
        <div class="entry-gate__backdrop absolute inset-0"></div>
        <div class="entry-gate__panel relative w-full max-w-sm rounded-[1.75rem] border border-border/70 px-6 py-7 sm:px-8 sm:py-8">
            <div class="ui-section-kicker">Private Access</div>
            <h2 id="entry-gate-title" class="ui-section-title mt-3 text-2xl">
                Enter Archive
            </h2>
            <p id="entry-gate-copy" class="ui-section-copy mt-3 text-sm">
                Use the access code to unlock the archive.
            </p>
            <div class="mt-6 flex flex-col gap-3">
                <label class="sr-only" for="entry-gate-input">Access code</label>
                <input
                    id="entry-gate-input"
                    name="password"
                    type="tel"
                    inputmode="numeric"
                    enterkeyhint="done"
                    autocomplete="off"
                    maxlength="4"
                    pattern="[0-9]*"
                    placeholder="Enter code"
                    class="ui-input px-5 py-3 text-center text-base tracking-[0.16em]"
                />
                <button
                    id="entry-gate-submit"
                    type="button"
                    class="ui-button ui-button--accent px-5 py-3 text-[11px] uppercase tracking-[0.28em]"
                >
                    Unlock
                </button>
            </div>
            <p id="entry-gate-error" class="mt-3 min-h-[1.5rem] text-center text-xs tracking-[0.04em] text-danger" aria-live="polite"></p>
            <button
                id="entry-gate-dismiss"
                type="button"
                class="ui-button ui-button--text mt-2 w-full text-center text-[11px]"
            >
                Need the code?
            </button>
        </div>
    </div>

    <div class="bg-glow"></div>

    <div
        class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-accent/5 filter blur-[100px] opacity-60 mix-blend-multiply pointer-events-none z-0"
        style="animation: auraFloat 20s ease-in-out infinite alternate;"
    ></div>
    <div
        class="fixed bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-text/5 filter blur-[120px] opacity-40 mix-blend-multiply pointer-events-none z-0"
        style="animation: auraFloat 25s ease-in-out infinite alternate-reverse;"
    ></div>
    <div
        class="fixed top-1/2 left-1/2 w-[40vw] h-[40vw] rounded-full bg-accent/3 filter blur-[150px] opacity-30 mix-blend-soft-light pointer-events-none z-0"
        style="animation: auraFloat 30s ease-in-out infinite alternate 5s;"
    ></div>

    <div
        class="fixed inset-0 z-0 opacity-[0.02] pointer-events-none"
        style="background-image: radial-gradient(currentColor 1px, transparent 1px); background-size: 48px 48px;"
    ></div>

    <div
        id="particles-container"
        class="fixed inset-0 z-0 pointer-events-none overflow-hidden opacity-30"
    ></div>

    <main
        id="archive-shell"
        class="flex-grow flex flex-col items-center justify-start px-5 pt-16 pb-8 sm:px-8 sm:pt-16 sm:pb-10 md:px-14 md:pt-16 md:pb-12 relative z-10 w-full max-w-[1380px] mx-auto overflow-visible"
        aria-labelledby="page-title"
    >
        <header class="text-center mb-7 md:mb-8 max-w-4xl mx-auto flex flex-col items-center animate-fade-up">
            <p class="ui-section-kicker text-[9px] md:text-[10px] mb-3 md:mb-4">
                Premium Collection
            </p>
            <h1
                id="page-title"
                class="ui-section-title text-3xl sm:text-5xl md:text-6xl mb-3 md:mb-4 px-2 text-center leading-[1.18] md:leading-[1.12]"
            >
                Simsang Archive
            </h1>
            <p class="ui-section-copy text-[11px] md:text-[12px] tracking-[0.08em] md:tracking-[0.12em] max-w-xl md:max-w-[46rem] text-center leading-6 md:leading-7 font-normal mt-1">
                Curated portals for astrology, yoga, the Gita, Bardo wisdom, and Samshin.
            </p>
            <ul
                class="mt-4 md:mt-5 flex flex-wrap items-center justify-center gap-2 md:gap-2.5 text-[8px] md:text-[9px] tracking-[0.06em] md:tracking-[0.1em]"
                aria-label="Archive disciplines"
            >
                <li class="ui-pill">Astrology</li>
                <li class="ui-pill">Yoga</li>
                <li class="ui-pill">Gita</li>
                <li class="ui-pill">Bardo</li>
                <li class="ui-pill">Samshin</li>
            </ul>
        </header>

        <section class="w-full" aria-labelledby="archive-heading">
            <h2 id="archive-heading" class="sr-only">Archive links</h2>
            <ul
                id="cards-grid"
                class="ui-grid archive-grid w-full px-1 md:px-0 py-6 md:py-0"
                style="perspective: 2000px;"
            ></ul>
        </section>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>

</html>

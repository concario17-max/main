    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..400,0..1&display=swap"
        rel="stylesheet" />

</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-300 font-body min-h-screen overflow-x-hidden overflow-y-auto flex flex-col transition-colors duration-1000 relative">

    <div
        id="entry-gate"
        class="entry-gate fixed inset-0 z-[80] flex items-center justify-center px-5 py-8"
        hidden
        aria-hidden="true"
        aria-modal="true"
        role="dialog"
        aria-labelledby="entry-gate-title"
        aria-describedby="entry-gate-copy"
    >
        <div class="entry-gate__backdrop absolute inset-0"></div>
        <div class="entry-gate__panel relative w-full max-w-sm rounded-[1.75rem] border border-border-light/70 dark:border-border-dark/80 px-6 py-7 sm:px-8 sm:py-8">
            <div class="entry-gate__eyebrow">Private Portal</div>
            <h2 id="entry-gate-title" class="mt-3 font-display text-2xl text-primary dark:text-white tracking-[0.12em] uppercase">
                Enter Archive
            </h2>
            <p id="entry-gate-copy" class="mt-3 text-sm leading-7 text-slate-700 dark:text-slate-200">
                비밀번호를 입력해야 포털에 입장할 수 있습니다.
            </p>
            <div class="mt-6 flex flex-col gap-3">
                <label class="sr-only" for="entry-gate-input">비밀번호</label>
                <input
                    id="entry-gate-input"
                    name="password"
                    type="tel"
                    inputmode="numeric"
                    enterkeyhint="done"
                    autocomplete="off"
                    maxlength="4"
                    pattern="[0-9]*"
                    placeholder="비밀번호 입력"
                    class="entry-gate__input w-full rounded-full border border-border-light/80 dark:border-border-dark bg-white/85 dark:bg-black/45 px-5 py-3 text-center text-base tracking-[0.16em] text-slate-800 dark:text-slate-100 outline-none transition-colors"
                />
                <button
                    id="entry-gate-submit"
                    type="button"
                    class="entry-gate__submit rounded-full border border-accent-light/40 dark:border-accent-dark/40 px-5 py-3 text-[11px] uppercase tracking-[0.28em] text-accent-light dark:text-accent-dark transition-all duration-500"
                >
                    Unlock
                </button>
            </div>
            <p id="entry-gate-error" class="mt-3 min-h-[1.5rem] text-center text-xs tracking-[0.04em] text-amber-700 dark:text-amber-300" aria-live="polite"></p>
            <button
                id="entry-gate-dismiss"
                type="button"
                class="mt-2 w-full text-center text-[11px] uppercase tracking-[0.22em] text-slate-500 dark:text-slate-400"
            >
                비밀번호 입력 필요
            </button>
        </div>
    </div>

    <div class="bg-glow"></div>

    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-accent-light/5 dark:bg-accent-dark/5 filter blur-[100px] opacity-60 mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"
        style="animation: auraFloat 20s ease-in-out infinite alternate;"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-primary/5 dark:bg-accent-dark/5 filter blur-[120px] opacity-40 mix-blend-multiply dark:mix-blend-screen pointer-events-none z-0"
        style="animation: auraFloat 25s ease-in-out infinite alternate-reverse;"></div>
    <div class="fixed top-1/2 left-1/2 w-[40vw] h-[40vw] rounded-full bg-accent-light/3 dark:bg-accent-dark/3 filter blur-[150px] opacity-30 mix-blend-soft-light pointer-events-none z-0"
        style="animation: auraFloat 30s ease-in-out infinite alternate 5s;"></div>

    <div class="fixed inset-0 z-0 opacity-[0.02] dark:opacity-[0.03] pointer-events-none"
        style="background-image: radial-gradient(currentColor 1px, transparent 1px); background-size: 48px 48px;"></div>

    <div id="particles-container"
        class="fixed inset-0 z-0 pointer-events-none overflow-hidden opacity-30 dark:opacity-40"></div>

    <button
        id="theme-toggle"
        type="button"
        aria-label="Toggle color theme"
        class="fixed top-5 right-5 md:top-8 md:right-8 z-50 p-3 rounded-full bg-white/50 dark:bg-black/50 border border-border-light dark:border-border-dark backdrop-blur-md text-accent-light dark:text-accent-dark hover:scale-105 transition-all duration-500 shadow-sm">
        <svg class="w-5 h-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
        <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
    </button>

    <main
        id="archive-shell"
        class="flex-grow flex flex-col items-center justify-start px-5 pt-16 pb-8 sm:px-8 sm:pt-16 sm:pb-10 md:px-14 md:pt-16 md:pb-12 relative z-10 w-full max-w-[1380px] mx-auto overflow-visible">
        <header class="text-center mb-7 md:mb-8 max-w-4xl mx-auto flex flex-col items-center animate-fade-up">
            <div
                class="text-[9px] md:text-[10px] tracking-[0.28em] md:tracking-[0.34em] text-accent-light dark:text-accent-dark uppercase mb-3 md:mb-4 font-medium">
                The Premium Collection
            </div>
            <h1
                class="archive-title text-3xl sm:text-5xl md:text-6xl font-display text-primary dark:text-white mb-3 md:mb-4 px-2 tracking-[0.12em] md:tracking-[0.14em] uppercase text-center leading-[1.18] md:leading-[1.12]">
                SIMSANG <span class="text-accent-light dark:text-accent-dark font-light italic">Archive</span>
            </h1>
            <p
                class="text-slate-700 dark:text-slate-200 font-body text-[10px] md:text-[12px] tracking-[0.08em] md:tracking-[0.12em] max-w-xl md:max-w-[46rem] text-center leading-6 md:leading-7 font-normal mt-1">
                A Living Portal for Astrology, Yoga, the Gita, Bardo Wisdom, and Samshin Doctrine<br />
                Refined Insight and Ancient Observation for the Eternal Mind
            </p>
            <div class="mt-4 md:mt-5 flex flex-wrap items-center justify-center gap-2 md:gap-2.5 text-[8px] md:text-[9px] tracking-[0.06em] md:tracking-[0.1em]">
                <span class="header-pill">점성 아카이브</span>
                <span class="header-pill">요가 수트라</span>
                <span class="header-pill">바가바드 기타</span>
                <span class="header-pill">사자의 서</span>
                <span class="header-pill">삼신 명등론</span>
            </div>
        </header>

        <div
            id="cards-grid"
            class="archive-grid w-full px-1 md:px-0 py-6 md:py-0"
            style="perspective: 2000px;"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
